<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>InterDimentional Cable TV</title>
  <meta name="description" content="A free browser-based broadcast TV simulator. Flip through bizarre channels of interdimensional cable — no pause, no rewind, just pure chaos.">
  <meta name="theme-color" content="#050403">

  <!-- OpenGraph / Social Previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="InterDimentional Cable TV">
  <meta property="og:description" content="Flip through bizarre channels of interdimensional cable in a 90s bedroom — no pause, no rewind, pure chaos.">
  <meta property="og:image" content="https://raunakpatil.github.io/InterdimentionalCable/docs/TVON.png">
  <meta property="og:url" content="https://raunakpatil.github.io/InterdimentionalCable/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="InterDimentional Cable TV">
  <meta name="twitter:description" content="Flip through bizarre channels of interdimensional cable in a 90s bedroom — no pause, no rewind, pure chaos.">
  <meta name="twitter:image" content="https://raunakpatil.github.io/InterdimentionalCable/docs/TVON.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <!-- 3D runtime (only fetched when the 3D room is enabled) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  
  <!-- Favicon (CRT emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
  
  <link rel="stylesheet" href="style.css?v=92">
  <link rel="stylesheet" href="three-scene.css?v=92">

  <!-- The 3D room is the only view. Show the boot screen before anything
       paints; three-scene.js hides it on success or on a hard failure. -->
  <script>
    (function () {
      document.documentElement.classList.add("room3d-pending");

      var loader = {
        lastProgress: Date.now(),
        progress: function (percent) {
          var el = document.getElementById("room-loading");
          if (!el || el.dataset.hiding) return;
          loader.lastProgress = Date.now();
          var fill = el.querySelector(".room-loading__fill");
          if (fill) {
            var value = Math.max(0, Math.min(100, Number(percent) || 0));
            fill.style.width = value + "%";
          }
        },
        hide: function () {
          var el = document.getElementById("room-loading");
          var root = document.documentElement;
          if (loader._hidden) return;
          if (!el) {
            root.classList.remove("room3d-pending");
            return;
          }
          loader._hidden = true;
          loader.progress(100);
          el.dataset.hiding = "1";
          el.classList.add("is-hiding");
          window.setTimeout(function () {
            root.classList.remove("room3d-pending");
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 550);
        },
      };
      window.__roomLoader = loader;

      // Escape hatch: hide only if loading has stalled for 30 seconds.
      // Progress events keep extending this during a slow download.
      window.setInterval(function () {
        if (!document.documentElement.classList.contains("room3d-pending")) return;
        if (Date.now() - loader.lastProgress > 30000) loader.hide();
      }, 5000);
    })();
  </script>
</head>
<body>

  <!-- Boot screen shown only while the 3D room is being fetched. -->
  <div id="room-loading" role="status" aria-live="polite" aria-label="Loading Interdimensional TV">
    <div class="room-loading__inner">
      <div class="room-loading__mark">INTERDIMENSIONAL TV</div>
      <div class="room-loading__bar" aria-hidden="true">
        <span class="room-loading__fill"></span>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  ROOM CONTAINER (Used for zooming)                      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div id="room-container">

    <!-- ═══════════════════════════════════════════════════════ -->
    <!--  ROOM BACKGROUND                                       -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div id="room-bg"></div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  THE TV UNIT                                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div id="tv-unit">
    <div id="tv-shell">
      <div id="tv-screen">

        <!-- Video content wrapper (animated on power on/off) -->
        <div id="tv-content">
          
          <!-- YouTube player fills this -->
          <div id="yt-player"></div>
          
          <!-- Blocks all clicks/touches on the YouTube player -->
          <div id="player-blocker"></div>
          
        </div>
        <!-- /tv-content -->

        <!-- CRT effect overlays -->
        <div id="phosphor-overlay"></div>
        <div id="glass-reflection"></div>

        <!-- Static noise (canvas, shown during channel switch) -->
        <div id="static-overlay">
          <canvas id="static-canvas"></canvas>
        </div>

        <!-- On-screen displays -->
        <div id="channel-osd">
          <div class="osd-channel-num">CH 01</div>
        </div>
        <div id="commercial-bug">AD</div>

        <!-- Power off black screen -->
        <div id="power-off-screen" class="active"></div>

      </div>
      <!-- /tv-screen -->
    </div>
    <!-- /tv-shell -->
  </div>
  <!-- /tv-unit -->

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  TV OFF BACKGROUND (Initial Scene)                      -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <img id="tv-off-bg" src="assets/tvoff.jpeg" alt="TV Off">

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  ROOM OVERLAY (Chroma Key Canvas)                       -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <canvas id="room-overlay-canvas"></canvas>

  </div>
  <!-- /room-container -->

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  ON-SCREEN REMOTE CONTROL                               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div id="remote-control">
    <div id="remote-led"></div>
    <button class="remote-btn" id="btn-power" title="Power (P)" style="display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </button>
    
    <div class="remote-label">CHANNEL</div>
    <div class="remote-row">
      <button class="remote-btn" id="btn-ch-down" title="Channel Down (←)">◀</button>
      <button class="remote-btn" id="btn-ch-up" title="Channel Up (→)">▶</button>
    </div>

    <div class="remote-label">VOLUME</div>
    <div class="remote-row">
      <button class="remote-btn" id="btn-vol-down" title="Volume Down (↓)">−</button>
      <button class="remote-btn" id="btn-vol-up" title="Volume Up (↑)">+</button>
    </div>

    <div class="remote-row">
      <button class="remote-btn" id="btn-mute" title="Mute (M)" style="display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
      <button class="remote-btn" id="btn-cc" title="Captions (C)" aria-pressed="false" style="display: flex; align-items: center; justify-content: center;">
        <span class="cc-label">CC</span>
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  BOOT SEQUENCE TEXT                                     -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div id="boot-text"></div>
  <div id="mobile-swipe-hint">You Can Also Swipe<br>Any Direction<br>To change the channels</div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  SCRIPTS (order matters — deps loaded first)            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 3D room imports (only used by three-scene.js) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>

  <script src="channels.js?v=92"></script>
  <script src="commercials.js?v=92"></script>
  <script src="sounds.js?v=92"></script>
  <script src="effects.js?v=92"></script>
  <script src="youtube.js?v=92"></script>
  <script src="app.js?v=92"></script>
  <script src="posters.js?v=92"></script>

  <!-- The 3D room. The hidden DOM room is its TV/remote host. -->
  <script type="module" src="three-scene.js?v=92"></script>

  <div id="creator-footer">
    <a href="https://github.com/raunakpatil" target="_blank">built with ❤️ by raunakpatil</a>
  </div>
</body>
</html>
